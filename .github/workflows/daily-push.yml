name: Daily Morning Push Notification

on:
  schedule:
    # 5:40 AM IST (00:10 UTC) - Morning Bible & Greeting
    - cron: '10 0 * * *'
    # 8:45 AM IST (03:15 UTC) - Morning Subject Reminder
    - cron: '15 3 * * *'
    # 10:00 AM IST (04:30 UTC) - Water Reminder
    - cron: '30 4 * * *'
    # 12:00 PM IST (06:30 UTC) - Water Reminder
    - cron: '30 6 * * *'
    # 1:10 PM IST (07:40 UTC) - Lunch time Check-in
    - cron: '40 7 * * *'
    # 2:00 PM IST (08:30 UTC) - Water Reminder
    - cron: '30 8 * * *'
    # 4:00 PM IST (10:30 UTC) - Water Reminder
    - cron: '30 10 * * *'
    # 6:00 PM IST (12:30 UTC) - Evening Cheer-up
    - cron: '30 12 * * *'
    # 8:00 PM IST (14:30 UTC) - Water Reminder
    - cron: '30 14 * * *'
    # 10:00 PM IST (16:30 UTC) - Water Reminder
    - cron: '30 16 * * *'
  # Allows manual triggers from GitHub Actions UI
  workflow_dispatch:

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run push script
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: npx tsx send-push.ts
