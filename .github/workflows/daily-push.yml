name: Daily Morning Push Notification

on:
  schedule:
    # 5:40 AM IST (00:10 UTC) - Run 20m early (23:50 UTC)
    - cron: '50 23 * * *'
    # 8:45 AM IST (03:15 UTC) - Run 20m early (02:55 UTC)
    - cron: '55 2 * * *'
    # 10:00 AM IST (04:30 UTC) - Run 20m early (04:10 UTC)
    - cron: '10 4 * * *'
    # 12:00 PM IST (06:30 UTC) - Run 20m early (06:10 UTC)
    - cron: '10 6 * * *'
    # 1:10 PM IST (07:40 UTC) - Run 20m early (07:20 UTC)
    - cron: '20 7 * * *'
    # 2:00 PM IST (08:30 UTC) - Run 20m early (08:10 UTC)
    - cron: '10 8 * * *'
    # 4:00 PM IST (10:30 UTC) - Run 20m early (10:10 UTC)
    - cron: '10 10 * * *'
    # 6:00 PM IST (12:30 UTC) - Run 20m early (12:10 UTC)
    - cron: '10 12 * * *'
    # 8:00 PM IST (14:30 UTC) - Run 20m early (14:10 UTC)
    - cron: '10 14 * * *'
    # 10:00 PM IST (16:30 UTC) - Run 20m early (16:10 UTC)
    - cron: '10 16 * * *'
  # Allows manual triggers from GitHub Actions UI
  workflow_dispatch:

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run push script
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          IS_GITHUB_ACTION: "true"
        run: npx tsx send-push.ts
