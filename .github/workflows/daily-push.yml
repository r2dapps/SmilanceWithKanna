name: Daily Morning Push Notification

on:
  schedule:
    # 5:40 AM IST (00:10 UTC)
    - cron: '10 0 * * *'
    # 8:45 AM IST (03:15 UTC)
    - cron: '15 3 * * *'
    # 1:10 PM IST (07:40 UTC)
    - cron: '40 7 * * *'
    # 6:00 PM IST (12:30 UTC)
    - cron: '30 12 * * *'
  # Allows manual triggers from GitHub Actions UI
  workflow_dispatch:

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run push script
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: npx tsx send-push.ts
