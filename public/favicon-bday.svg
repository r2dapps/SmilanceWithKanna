<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep romantic dark-purple gradient background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#180828" />
      <stop offset="100%" stop-color="#2e082c" />
    </linearGradient>
    <!-- Heart pink-gold glowing gradient -->
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <!-- Party Hat gradient -->
    <linearGradient id="hat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <!-- Text glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" stroke="rgba(244, 63, 94, 0.2)" stroke-width="4" />

  <!-- Glowing background heart aura -->
  <path d="M256,370 L232,348 C156,278 106,232 106,177 C106,132 140,98 185,98 C211,98 236,111 256,132 C276,111 301,98 327,98 C372,98 406,132 406,177 C406,232 356,278 280,348 L256,370 Z" fill="rgba(244, 63, 94, 0.12)" transform="scale(1.1) translate(-23, -25)" />

  <!-- Main Romantic Heart -->
  <path d="M256,360 L233,338 C160,272 112,228 112,175 C112,130 145,97 190,97 C215,97 240,110 256,130 C272,110 297,97 322,97 C367,97 400,130 400,175 C400,228 352,272 279,338 L256,360 Z" fill="url(#heart-grad)" />

  <!-- Birthday Party Hat perched tilted on left lobe of heart -->
  <g transform="translate(142, 60) rotate(-16)">
    <polygon points="45,0 12,85 78,85" fill="url(#hat-grad)" stroke="#fef08a" stroke-width="2.5" />
    <!-- Hat Diagonal Stripes -->
    <path d="M26,45 L64,45" stroke="#fef08a" stroke-width="3" opacity="0.8" />
    <path d="M20,65 L70,65" stroke="#fef08a" stroke-width="3" opacity="0.8" />
    <!-- Hat Pom-pom -->
    <circle cx="45" cy="-2" r="11" fill="#fbcfe8" filter="url(#glow)" />
    <!-- Hat Base Trim -->
    <ellipse cx="45" cy="85" rx="33" ry="7" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- Festive Confetti Orbs & Hearts (No Stars) -->
  <circle cx="120" cy="190" r="5" fill="#fbcfe8" opacity="0.85" />
  <circle cx="370" cy="150" r="6" fill="#fde047" opacity="0.85" />
  <circle cx="395" cy="220" r="4" fill="#fb7185" opacity="0.8" />
  <circle cx="105" cy="270" r="4" fill="#fde047" opacity="0.75" />

  <!-- Beautiful "Smilance" Labeled Text -->
  <text x="256" y="435" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#glow)">SMILANCE</text>
  <text x="256" y="465" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#fda4af" text-anchor="middle" letter-spacing="6">BIRTHDAY EDITION</text>
</svg>
